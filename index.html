<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#216848">
  <title>Аврора Агро — полевые работы</title>
  <link rel="stylesheet" href="vendor/aurora/dist/styles.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="aurora.css">
  <script src="fleet.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-ds-theme="DEFAULT" data-ds-appearance="light" data-ds-density="cozy">
  <aside class="sidebar">
    <a class="brand" href="#operations" aria-label="Аврора Агро, операции"><span class="brand-mark"><img src="vendor/aurora/logo.png" alt=""></span><span>AURORA<span class="brand-sub">Агро</span></span></a>
    <div class="farm"><span class="farm-icon">↟</span><div><strong>Хозяйство «Рассвет»</strong><small>Демонстрационное хозяйство</small></div></div>
    <nav aria-label="Основная навигация">
      <a href="#fields" data-page="fields" aria-label="Поля"><span data-icon="fields"></span><span class="nav-label">Поля</span><span class="nav-count">6</span></a>
      <a href="#rotation" data-page="rotation" aria-label="Севооборот"><span data-icon="rotation"></span><span class="nav-label">Севооборот</span></a>
      <a href="#operations" data-page="operations" aria-label="Операции"><span data-icon="operations"></span><span class="nav-label">Операции</span><span class="nav-count" id="pending-count">4</span></a>
      <a href="#reports" data-page="reports" aria-label="Отчёты"><span data-icon="reports"></span><span class="nav-label">Отчёты</span></a>
      <a href="#directory" data-page="directory" aria-label="Справочники"><span data-icon="directory"></span><span class="nav-label">Справочники</span></a>
    </nav>
    <div class="sidebar-bottom"><div class="connection"><i></i><span>Аврора GPS<small>Демонстрационные треки</small></span><span class="connection-check">✓</span></div><button class="help-button" id="help" aria-label="О макете"><span data-icon="help"></span><span class="nav-label">О макете</span></button><div class="profile"><span class="avatar">АК</span><div><strong>Александр Ковалёв</strong><small>Агроном</small></div></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumbs">Рабочее пространство<span>/</span><strong id="breadcrumb">Операции</strong></div><div class="topbar-right"><button class="appearance-control" id="appearance" aria-label="Включить тёмное оформление" title="Тёмное оформление"><span class="ds-symbol" aria-hidden="true">dark_mode</span></button><button class="appearance-control" id="density" aria-label="Включить компактную плотность" title="Компактная плотность"><span class="ds-symbol" aria-hidden="true">density_small</span></button><span class="prototype-tag">MVP · демо</span><label class="season-select">Сезон <select id="global-season" aria-label="Текущий сезон"><option>2026</option><option>2025</option><option>2027</option></select></label></div></header>
    <main id="main"></main>
    <footer class="footer"><span>Аврора Агро</span><span>Меньше рутины. Больше ясности в поле.</span><span>Демонстрационные данные</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
</body>
</html>
